# 本文件仅用于本地演示。生产环境使用 config.prod.yaml 并设置 GF_GCFG_FILE。
# https://goframe.org/docs/web/server-config-file-template
server:
  address:     ":8001"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

security:
  # 本地演示保留“切换当前登录用户”。生产必须设为 false，并由可信网关写入下方用户头。
  demoMode: true
  trustedUserHeader: "X-Authenticated-User-Id"

# https://goframe.org/docs/core/glog-config
logger:
  level : "all"
  stdout: true

# https://goframe.org/docs/core/gdb-config-file
database:
  default:
    link: "mysql:root:123456@tcp(127.0.0.1:3306)/security_permission?loc=Local&parseTime=true&charset=utf8mb4"
